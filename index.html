<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebQuest đầu tiên của em</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7e8;--ink:#24304a;--muted:#5d6b8a;--card:#ffffff;--line:#eadfca;
  --blue:#4f7cff;--orange:#ff9a3c;--green:#25b374;--purple:#8a63f6;--pink:#e8559a;--red:#ee5a5a;--yellow:#ffc928;
  --shadow:0 10px 30px rgba(36,48,74,.13);
}
*{box-sizing:border-box}
html{font-size:20px}
body{margin:0;font-family:"Nunito","Segoe UI",system-ui,-apple-system,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(circle at 8% 10%,#ffe9b8 0,transparent 32%),radial-gradient(circle at 92% 90%,#d9e6ff 0,transparent 34%),var(--bg);
  min-height:100vh;transition:background .4s,color .4s}
body.night{background:#101a33;color:#f3f6ff}
#app{max-width:1180px;margin:0 auto;padding:12px 18px 18px;display:flex;flex-direction:column;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:6px 4px}
.brand{font-weight:900;font-size:1.05rem}
.who{font-size:.8rem;color:var(--muted);font-weight:700}
body.night .who{color:#aab8e0}
/* progress */
#progress{display:flex;gap:8px;margin:6px 0 10px}
#progress.hidden{visibility:hidden}
.pstep{flex:1;text-align:center;font-size:.72rem;font-weight:800;color:var(--muted);position:relative}
.pstep .bar{height:10px;border-radius:99px;background:#e9e1d0;overflow:hidden;margin-bottom:4px}
.pstep .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--purple));border-radius:99px;transition:width .5s}
.pstep.done .bar i{width:100%}
.pstep.cur{color:var(--ink)}
.pstep.cur .bar i{width:var(--w,50%)}
body.night .pstep{color:#8ea0d0}
body.night .pstep .bar{background:#24325c}
/* banner */
#banner{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;margin-bottom:8px;min-height:0}
.role{background:#fff;border:2px solid var(--line);border-radius:99px;padding:6px 18px;font-size:.82rem;box-shadow:0 3px 10px rgba(36,48,74,.07)}
.role.solo{background:#f2ecff;border-color:#d9ccff}
.swap{background:var(--yellow);color:#3b2a00;font-weight:900;border-radius:99px;padding:6px 18px;font-size:.9rem;animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.07)}}
main{flex:1;display:flex;flex-direction:column;justify-content:flex-start}
.card{background:var(--card);border-radius:28px;box-shadow:var(--shadow);padding:26px 34px;animation:rise .45s ease both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.center{text-align:center}
h1{font-size:2.3rem;line-height:1.15;margin:.2em 0;font-weight:900}
h2{font-size:1.55rem;line-height:1.25;margin:.2em 0 .5em;font-weight:900}
h3{font-size:1.15rem;margin:.3em 0;font-weight:800}
p{margin:.45em 0;line-height:1.45}
.lead{font-size:1.2rem}.lead.strong{font-weight:800}
.bigemoji{font-size:4rem;line-height:1}
.bounce{animation:bounce 1.6s ease-in-out infinite}
@keyframes bounce{50%{transform:translateY(-10px)}}
.teacher{color:var(--muted);font-size:.9rem}
.form{display:grid;grid-template-columns:1fr 1fr 160px;gap:14px;margin:16px 0 4px;text-align:left}
label{font-weight:800;font-size:.8rem;color:var(--muted);display:block}
input[type=text],input:not([type]),textarea{width:100%;font:inherit;font-size:1rem;font-weight:700;color:var(--ink);padding:10px 14px;margin-top:4px;border:3px solid var(--line);border-radius:16px;background:#fffdf8;outline:none}
input:focus,textarea:focus{border-color:var(--blue)}
.bar{display:flex;justify-content:center;gap:12px;margin-top:20px;flex-wrap:wrap}
.btn{font:inherit;font-weight:900;font-size:1.05rem;border:0;border-radius:99px;padding:12px 30px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 6px 0 #3a54b3,0 10px 20px rgba(79,124,255,.3);transition:transform .1s,box-shadow .1s}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 #3a54b3}
.btn:disabled{background:#cfd5e4;box-shadow:0 6px 0 #aab2c8;cursor:not-allowed;color:#f4f6fb}
.btn.big{font-size:1.25rem;padding:14px 38px}
.btn.alt{background:linear-gradient(135deg,var(--orange),#ff6b6b);box-shadow:0 6px 0 #c4602a}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.sm{font-size:.8rem;padding:6px 14px;box-shadow:0 3px 0 var(--line)}
/* situation */
.bubble{background:#fff4d6;border:3px dashed #f0c25a;border-radius:24px;padding:18px 24px;font-size:1.25rem;margin:10px 0}
.pw{display:inline-block;font-family:"Courier New",monospace;font-weight:900;background:#24304a;color:#fff;border-radius:10px;padding:2px 12px}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:12px}
.choice{font:inherit;font-weight:900;font-size:1.2rem;padding:22px 10px;border-radius:22px;border:4px solid var(--line);background:#fff;cursor:pointer;transition:.15s}
.choice:hover{transform:translateY(-3px);border-color:var(--blue)}
.choice.sel{border-color:var(--blue);background:#eaf0ff;transform:scale(1.03)}
.choice span{display:block;font-size:2.2rem}
.note{background:#eaf7f0;border-left:6px solid var(--green);border-radius:14px;padding:10px 16px;margin-top:14px;font-weight:800}
/* challenge */
.challenge{background:linear-gradient(135deg,#fff0d6,#ffe1ec);border-radius:26px;padding:26px;font-size:1.4rem;font-weight:800;margin:14px 0;border:4px solid #ffc27a}
.tag{display:inline-block;background:var(--orange);color:#fff;font-weight:900;border-radius:99px;padding:3px 18px;letter-spacing:.06em;font-size:.9rem}
/* dnd */
.dnd{display:grid;gap:12px}
.tray{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;min-height:64px;padding:12px;background:#f6f1e5;border-radius:20px;border:3px dashed var(--line)}
.chip{background:#fff;border:3px solid #cdbfa0;border-radius:16px;padding:10px 16px;font-weight:900;font-size:1.05rem;cursor:grab;user-select:none;box-shadow:0 4px 0 #cdbfa0;transition:transform .12s;max-width:100%}
.chip small{display:block;font-weight:700;color:var(--muted);font-size:.7rem}
.chip.pw-chip{font-family:"Courier New",monospace;font-size:1.25rem}
.chip:hover{transform:translateY(-2px)}
.chip.sel{border-color:var(--blue);background:#eaf0ff;box-shadow:0 4px 0 var(--blue);transform:scale(1.05)}
.chip.placed{cursor:default;box-shadow:none;margin:4px}
.chip.ok{border-color:var(--green);background:#e7f8ef}
.chip.shake{animation:shake .45s;border-color:var(--red)}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.zones{display:grid;gap:12px}
.zones.two{grid-template-columns:1fr 1fr}
.zone{border:4px dashed #cbbd9c;border-radius:22px;padding:10px 14px;min-height:96px;background:#fffdf8;transition:.15s}
.zone.over{background:#eaf0ff;border-color:var(--blue)}
.zone .zlabel{font-weight:900;font-size:1.05rem;margin-bottom:4px}
.zone .zdrop{display:flex;flex-wrap:wrap;gap:6px;min-height:40px}
.zone.red{border-color:#f3a0a0;background:#fff3f3}.zone.green{border-color:#8fdab6;background:#effaf4}
.zones.rows .zone{display:grid;grid-template-columns:230px 1fr;align-items:center;min-height:62px;padding:6px 14px}
.zones.rows .zlabel{margin:0}
.fb{min-height:52px;margin-top:10px;padding:10px 18px;border-radius:18px;font-weight:800;font-size:1rem;background:#f1f4fb;color:var(--muted)}
.fb.ok{background:#e4f7ec;color:#136b43}.fb.hint{background:#fff1d4;color:#7a4b00}.fb.no{background:#ffe5e5;color:#8d2323}
/* resource infographic */
.info{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:16px 0}
.icard{background:#f2ecff;border-radius:22px;padding:16px 8px;text-align:center;font-weight:900;font-size:.9rem;animation:pop .5s both}
.icard span{display:block;font-size:2.4rem;margin-bottom:4px}
@keyframes pop{from{opacity:0;transform:scale(.7)}to{opacity:1;transform:none}}
.pwhead{font-size:1.7rem;font-weight:900;text-align:center}
/* inputs */
.advice{display:grid;gap:12px;margin:10px 0}
.advice .row{display:grid;grid-template-columns:48px 1fr;align-items:center;gap:10px}
.num{width:48px;height:48px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-weight:900;font-size:1.3rem}
.small{font-size:.8rem;color:var(--muted)}
/* quiz */
.qn{font-weight:900;color:var(--blue);font-size:.85rem;letter-spacing:.05em}
.think{color:var(--muted);font-weight:700;font-size:.85rem}
.opts{display:grid;gap:12px;margin:14px 0}
.opts.grid{grid-template-columns:1fr 1fr}
.opt{font:inherit;text-align:left;font-weight:800;font-size:1.1rem;padding:16px 22px;border-radius:20px;border:4px solid var(--line);background:#fff;cursor:pointer;transition:.15s;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--blue);transform:translateX(3px)}
.opt.sel{border-color:var(--blue);background:#eaf0ff}
.opt.right{border-color:var(--green);background:#e7f8ef}
.opt.wrong{border-color:var(--red);background:#ffecec;animation:shake .45s}
.opt .k{width:34px;height:34px;border-radius:50%;background:#f1eadb;display:grid;place-items:center;flex:none}
/* flow diagram */
.flow{display:flex;align-items:stretch;justify-content:center;gap:6px;margin:18px 0;flex-wrap:nowrap}
.fnode{flex:1 1 0;min-width:0;border-radius:22px;padding:14px 8px;text-align:center;color:#fff;font-weight:900;font-size:.95rem;animation:pop .6s both;display:flex;flex-direction:column;justify-content:center;gap:2px}
.fnode .fi{font-size:2.3rem}
.fnode small{font-weight:800;opacity:.95;font-size:.78rem;line-height:1.3}
.farrow{align-self:center;font-size:1.6rem;color:var(--muted);animation:pop .6s both}
.c-blue{background:var(--blue)}.c-orange{background:var(--orange)}.c-green{background:var(--green)}.c-purple{background:var(--purple)}.c-pink{background:var(--pink)}
.big-reveal{font-size:1.6rem;font-weight:900;text-align:center;color:var(--purple);animation:pop .8s 2s both}
.def{background:linear-gradient(135deg,#e8efff,#f2e9ff);border-radius:24px;padding:22px 28px;font-size:1.3rem;font-weight:800;line-height:1.45;margin:12px 0}
.shout{font-size:1.8rem;font-weight:900;text-align:center;color:var(--pink);margin:16px 0 8px}
.tools{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.tool{background:#fff;border:3px solid var(--line);border-radius:16px;padding:8px 16px;font-weight:800}
.comp{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:14px 0}
.cc{border-radius:22px;padding:16px 10px;color:#fff;text-align:center;animation:pop .5s both}
.cc .fi{font-size:2.5rem}.cc b{display:block;font-size:1rem}.cc .q{font-size:.95rem;font-weight:800;margin-top:4px;background:rgba(255,255,255,.22);border-radius:12px;padding:4px 6px}
.cc small{display:block;font-weight:700;margin-top:6px;font-size:.72rem;opacity:.95}
.stack{display:flex;flex-direction:column;align-items:center;gap:2px}
/* timer */
.timer{--p:0;width:150px;height:150px;border-radius:50%;margin:10px auto;display:grid;place-items:center;background:conic-gradient(var(--blue) calc(var(--p)*1%),#e6ebf8 0);position:relative}
.timer::after{content:"";position:absolute;inset:14px;background:#fff;border-radius:50%}
body.night .timer::after{background:#101a33}
body.night .timer{background:conic-gradient(var(--yellow) calc(var(--p)*1%),#24325c 0)}
.timer span{position:relative;z-index:1;font-size:2.2rem;font-weight:900}
.hidebox{text-align:center;padding:36px;border-radius:24px;background:#eef2fb;font-size:1.4rem;font-weight:900;color:var(--muted);animation:pop .4s}
/* leave screen */
.leave h1{font-size:2.8rem}
.leave .bigemoji{font-size:6rem}
body.night .card{background:#17244a;box-shadow:0 10px 40px rgba(0,0,0,.4)}
body.night .btn.ghost{background:#17244a;color:#fff;border-color:#2c3d78;box-shadow:0 4px 0 #2c3d78}
/* mindmap */
.mm{width:100%;max-height:48vh}
.mm text{font-family:inherit;font-weight:900;fill:#fff}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:8px}
.dd ul{margin:0;padding:12px 18px;list-style:none;border-radius:18px;font-weight:800;font-size:.9rem}
.dd .y{background:#e7f8ef}.dd .n{background:#ffecec}
.dd li{margin:3px 0}
.hint-box{background:#fff4d6;border-radius:18px;padding:12px 18px;font-weight:800;margin-top:10px}
.topics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}
.topic{font:inherit;font-weight:900;padding:18px 8px;border-radius:20px;border:4px solid var(--line);background:#fff;cursor:pointer;transition:.15s;font-size:.95rem}
.topic span{display:block;font-size:2.2rem}
.topic:hover{border-color:var(--green);transform:translateY(-3px)}
.topic.sel{border-color:var(--green);background:#e7f8ef}
.fill{display:grid;gap:10px;margin:10px 0}
.fcard{display:grid;grid-template-columns:70px 1fr auto;gap:12px;align-items:center;border-radius:20px;padding:10px 16px;background:#fff;border:4px solid var(--line)}
.fcard .ic{font-size:2.2rem;text-align:center}
.fcard b{font-size:1.05rem}
.fcard .lim{display:inline-block;background:var(--yellow);border-radius:99px;padding:0 10px;font-size:.75rem;font-weight:900;margin-left:6px}
.fcard .ex{font-size:.8rem;color:var(--muted);font-weight:700}
.fcard.done{border-color:var(--green);background:#f1fbf6}
.tick{font:inherit;font-weight:900;border:3px solid var(--line);background:#fff;border-radius:14px;padding:6px 12px;cursor:pointer;font-size:.85rem}
.tick.on{background:var(--green);color:#fff;border-color:var(--green)}
.starters{list-style:none;padding:0;margin:10px 0;display:grid;gap:8px}
.starters li{background:#eef2fb;border-radius:16px;padding:10px 18px;font-weight:800}
.starters li b{color:var(--purple)}
.rules{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:10px 0}
.rules span{background:#fff4d6;border-radius:99px;padding:6px 16px;font-weight:900}
.stars{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.star{font:inherit;font-weight:800;text-align:left;border:3px solid var(--line);background:#fff;border-radius:16px;padding:8px 14px;cursor:pointer;flex:1 1 100%;font-size:.95rem}
.star.sel{border-color:var(--yellow);background:#fff8dc}
.mini-tabs{display:flex;gap:8px;margin-bottom:6px}
.mini-tabs span{padding:4px 14px;border-radius:99px;background:#e9e1d0;font-weight:900;font-size:.8rem}
.mini-tabs span.on{background:var(--blue);color:#fff}
.chain{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;margin:14px 0}
.chain .it{background:#eef2fb;border-radius:18px;padding:10px 16px;font-weight:900}
.chain .ar{font-size:1.4rem;color:var(--muted)}
.closing{font-size:1.2rem;font-weight:800;line-height:1.5}
.finale{font-size:1.8rem;font-weight:900;color:var(--green);margin-top:10px}
.confetti{position:fixed;top:-40px;font-size:1.8rem;animation:fall linear forwards;pointer-events:none;z-index:5}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.8}}
.foot{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px;font-size:.7rem;color:var(--muted);font-weight:700}
.foot select{font:inherit;font-size:.7rem;padding:2px 6px;border-radius:8px;border:1px solid var(--line)}
.foot button{font:inherit;font-size:.7rem;background:none;border:1px solid var(--line);border-radius:8px;padding:2px 8px;cursor:pointer;color:var(--muted)}
body.night .foot{color:#8ea0d0}
@media (max-width:900px){
  html{font-size:17px}
  .form,.choices,.info,.comp,.topics,.dd,.opts.grid{grid-template-columns:1fr 1fr}
  .form{grid-template-columns:1fr}
  .flow{flex-direction:column}.farrow{transform:rotate(90deg)}
  .zones.rows .zone{grid-template-columns:1fr}
  .zones.two{grid-template-columns:1fr}
  .card{padding:20px}
  h1{font-size:1.8rem}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="brand">🌍 WebQuest đầu tiên của em</div><div class="who" id="who"></div></header>
  <nav id="progress" class="hidden" aria-label="Tiến trình"></nav>
  <div id="banner"></div>
  <main id="stage"></main>
  <footer class="foot">
    <span>Giáo viên: Huỳnh Văn Diễn</span>
    <label style="display:inline">Chuyển màn hình: <select id="jump"></select></label>
    <button id="reset" type="button">Làm lại từ đầu</button>
  </footer>
</div>

<script>
(function(){
'use strict';
/* ---------- tiện ích ---------- */
const $=(s,r=document)=>r.querySelector(s);
const html=s=>{const t=document.createElement('template');t.innerHTML=s.trim();return t.content.firstElementChild};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const KEY='webquest_dau_tien_v1';
const STAGES=['Trải nghiệm','Nhận ra','Hiểu','Thử thiết kế','Vẽ vào tập'];
const fresh=()=>({idx:0,last:0,n1:'',n2:'',cls:'',predict:'',advice:['','',''],newpw:'',topic:'',exit:{}});
let S=fresh();
try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(fresh(),JSON.parse(r));S.idx=0}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let timers=[],prevRole=0;
function clearTimers(){timers.forEach(clearInterval);timers=[]}
function countdown(el,secs,onTick,onEnd){
  let left=secs;
  const paint=()=>{const m=Math.floor(left/60),s=left%60;el.querySelector('span').textContent=m+':'+String(s).padStart(2,'0');el.style.setProperty('--p',((secs-left)/secs)*100)};
  paint();
  const id=setInterval(()=>{left--;paint();if(left<=0){clearInterval(id);onEnd&&onEnd()}},1000);
  timers.push(id);
  return {skip(){clearInterval(id);left=0;paint();onEnd&&onEnd()}};
}

/* ---------- thành phần dùng chung ---------- */
const COMP=[
 {k:'intro',icon:'🌍',name:'GIỚI THIỆU',q:'Có vấn đề gì?',d:'Tạo bối cảnh',c:'blue'},
 {k:'task',icon:'🎯',name:'NHIỆM VỤ',q:'Người học phải làm gì?',d:'Nêu mục tiêu hoặc sản phẩm',c:'orange'},
 {k:'proc',icon:'🔍',name:'QUÁ TRÌNH',q:'Làm bằng cách nào?',d:'Các bước thực hiện',c:'green'},
 {k:'src',icon:'📚',name:'NGUỒN HỌC',q:'Có thể học từ đâu?',d:'Sách, hình ảnh, website, video, quan sát, người khác',c:'purple'},
 {k:'prod',icon:'🚀',name:'SẢN PHẨM',q:'Cuối cùng tạo được gì?',d:'Poster, sơ đồ, video, chương trình, bài viết…',c:'pink'}
];
function flow(nodes){
  return '<div class="flow">'+nodes.map((n,i)=>
    `<div class="fnode c-${n.c}" style="animation-delay:${i*.35}s"><div class="fi">${n.icon}</div><b>${n.title}</b>${n.sub?`<small>${n.sub}</small>`:''}</div>`+
    (i<nodes.length-1?`<div class="farrow" style="animation-delay:${i*.35+.2}s">➜</div>`:'')).join('')+'</div>';
}
function nextBar(box,label,disabled,extra){
  const bar=html('<div class="bar"></div>');
  const b=html(`<button class="btn big" type="button">${label}</button>`);
  b.disabled=!!disabled;
  b.addEventListener('click',()=>go(S.idx+1));
  bar.append(b);
  if(extra)bar.append(extra);
  box.append(bar);
  return b;
}
/* kéo thả có phản hồi gợi ý; bấm chọn rồi bấm ô để thay thế khi không kéo được */
function dnd(box,o){
  const wrap=html('<div class="dnd"><div class="tray"></div><div class="zones '+(o.zcls||'')+'"></div></div>');
  const fb=html(`<div class="fb" aria-live="polite">${o.tip||''}</div>`);
  box.append(wrap,fb);
  const tray=$('.tray',wrap),zbox=$('.zones',wrap);
  const byId={},chips={},zel={};
  let sel=null,done=0;
  const say=(t,m)=>{fb.className='fb '+t;fb.innerHTML=m};
  const clearSel=()=>{if(sel&&chips[sel])chips[sel].classList.remove('sel');sel=null};
  function place(id,z){
    const it=byId[id],c=chips[id];
    if(!it||c.classList.contains('placed'))return;
    clearSel();
    if(it.zone===z){
      $('.zdrop',zel[z]).append(c);c.classList.add('placed','ok');c.draggable=false;done++;
      say('ok',it.ok);
      if(done===o.items.length)setTimeout(()=>o.onDone&&o.onDone(),500);
    }else{
      c.classList.add('shake');setTimeout(()=>c.classList.remove('shake'),500);
      say('hint',(it.hints&&it.hints[z])||it.hint);
    }
  }
  o.zones.forEach(z=>{
    const d=html(`<div class="zone ${z.cls||''}"><div class="zlabel">${z.label}</div><div class="zdrop"></div></div>`);
    zel[z.id]=d;zbox.append(d);
    d.addEventListener('dragover',e=>{e.preventDefault();d.classList.add('over')});
    d.addEventListener('dragleave',()=>d.classList.remove('over'));
    d.addEventListener('drop',e=>{e.preventDefault();d.classList.remove('over');const id=e.dataTransfer.getData('text/plain')||sel;if(id)place(id,z.id)});
    d.addEventListener('click',()=>{if(sel)place(sel,z.id)});
  });
  (o.shuffle?shuffle(o.items):o.items).forEach(it=>{
    byId[it.id]=it;
    const c=html(`<div class="chip ${it.cls||''}" draggable="true" tabindex="0" role="button">${it.html}</div>`);
    chips[it.id]=c;tray.append(c);
    c.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',it.id);sel=it.id});
    c.addEventListener('click',e=>{if(c.classList.contains('placed'))return;e.stopPropagation();const was=sel===it.id;clearSel();if(!was){sel=it.id;c.classList.add('sel');say('',' 👉 Bấm vào ô em muốn đặt vào.')}});
    c.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();c.click()}});
  });
}
function confetti(){
  const em=['🎉','⭐','🌟','✨','🎊','💡'];
  for(let i=0;i<28;i++){
    const s=document.createElement('span');s.className='confetti';s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+'vw';s.style.animationDuration=(3+Math.random()*3)+'s';s.style.animationDelay=Math.random()*1.5+'s';
    document.body.append(s);setTimeout(()=>s.remove(),8000);
  }
}

function quizSingle(n,title,opts,ans,okMsg,hint){
  return box=>{
    const sec=html(`<section class="card"><div class="qn">CÂU ${n}/4</div><h2>${title}</h2>
      <p class="think">👥 Bàn bạc với bạn bên cạnh rồi hãy chọn nhé.</p><div class="opts"></div><div class="fb"></div></section>`);
    box.append(sec);
    const nb=nextBar(box,'Câu tiếp theo ➜',true);
    const fb=$('.fb',sec);let ok=false;
    opts.forEach((t,i)=>{
      const k='ABCD'[i];
      const b=html(`<button type="button" class="opt"><span class="k">${k}</span>${t}</button>`);
      b.addEventListener('click',()=>{
        if(ok)return;
        if(k===ans){ok=true;b.classList.add('right');fb.className='fb ok';fb.innerHTML=okMsg;nb.disabled=false}
        else{b.classList.add('wrong');setTimeout(()=>b.classList.remove('wrong'),500);fb.className='fb hint';fb.innerHTML=hint}
      });
      $('.opts',sec).append(b);
    });
  };
}

add('5.7 Exit Ticket',5,0,box=>{
  const holder=html('<div></div>');box.append(holder);
  const nb=nextBar(box,'Xem màn hình kết thúc ➜',true);
  const names=[S.n1,S.n2];
  function ticket(k){
    const ans=S.exit[k]||{};
    holder.innerHTML='';
    const sec=html(`<section class="card"><div class="mini-tabs">${names.map((n,i)=>`<span class="${i===k?'on':''}">${esc(n)}</span>`).join('')}</div>
      <h2>🎟️ Exit Ticket của ${esc(names[k])}</h2>
      <h3>Câu 1. WebQuest giống nhất với:</h3><div class="opts grid" id="q1"></div><div class="fb" id="f1"></div>
      <h3>Câu 2. WebQuest có bắt buộc phải là website không?</h3><div class="opts grid" id="q2"></div><div class="fb" id="f2"></div>
      <h3>Câu 3. Em đã vẽ WebQuest đầu tiên chưa?</h3><div class="opts grid" id="q3"></div>
      <h3>Câu 4. Em tự đánh giá:</h3><div class="stars" id="q4"></div>
      <div class="bar"><button class="btn" id="sub" type="button" disabled>${k===0?'Nộp và đến bạn tiếp theo ➜':'Nộp Exit Ticket ✔'}</button></div></section>`);
    holder.append(sec);
    const fin=()=>{$('#sub').disabled=!(ans.q1&&ans.q2&&ans.q3&&ans.q4)};
    const mk=(id,opts,key,correct,fbId,msgs)=>{
      opts.forEach((t,i)=>{
        const k2=typeof t==='string'?'ABCD'[i]:t[0];const txt=typeof t==='string'?t:t[1];
        const b=html(`<button type="button" class="opt">${typeof t==='string'?`<span class="k">${k2}</span>`:''}${txt}</button>`);
        if(ans[key]===k2)b.classList.add('sel');
        b.addEventListener('click',()=>{
          $('#'+id).querySelectorAll('.opt').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');ans[key]=k2;
          if(fbId){const f=$('#'+fbId);const ok=k2===correct;f.className='fb '+(ok?'ok':'hint');f.innerHTML=ok?msgs[0]:msgs[1]}
          fin();
        });
        $('#'+id).append(b);
      });
    };
    mk('q1',['Một bài đọc.','Một hành trình học tập.','Một bài kiểm tra.','Một trang web.'],'q1','B','f1',['👍 Đúng! WebQuest là một hành trình học tập.','💡 Hãy nhớ lại: em đã đi qua vấn đề → nhiệm vụ → khám phá → sản phẩm. Đó là gì?']);
    mk('q2',['Có','Không'],'q2','B','f2',['👍 Đúng! WebQuest có thể vẽ trên giấy, mindmap, slide… không nhất thiết là website.','💡 Hôm nay em vừa vẽ WebQuest ở đâu? Trong tập!']);
    mk('q3',[['xong','✅ Đã xong'],['gan','🟡 Gần xong'],['cantro','🔴 Cần hỗ trợ']],'q3',null,null,null);
    const st=['⭐ Em còn chưa hiểu.','⭐⭐ Em bắt đầu hiểu.','⭐⭐⭐ Em hiểu WebQuest là gì.','⭐⭐⭐⭐ Em có thể tự tạo một WebQuest đơn giản.','⭐⭐⭐⭐⭐ Em có thể giải thích cho bạn khác.'];
    st.forEach((t,i)=>{
      const b=html(`<button type="button" class="star">${t}</button>`);
      if(ans.q4===i+1)b.classList.add('sel');
      b.addEventListener('click',()=>{$('#q4').querySelectorAll('.star').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');ans.q4=i+1;fin()});
      $('#q4').append(b);
    });
    fin();
    $('#sub').addEventListener('click',()=>{
      S.exit[k]=ans;save();
      if(k===0)ticket(1);else{holder.innerHTML='<section class="card center"><div class="bigemoji">🎟️</div><h2>Cả hai bạn đã nộp Exit Ticket!</h2></section>';nb.disabled=false}
    });
  }
  ticket(0);
},{banner:'🎟️ Mỗi bạn trả lời Exit Ticket của riêng mình'});

    <div class="chain"><span class="it">👀 Trải nghiệm</span><span class="ar">➜</span><span class="it">🧠 Nhớ lại</span><span class="ar">➜</span><span class="it">✏️ Vẽ lại</span><span class="ar">➜</span><span class="it">💡 Tạo ý tưởng</span><span class="ar">➜</span><span class="it">🗣️ Giải thích</span></div>
    <p class="closing">Máy tính giúp em trải nghiệm.<br>Nhưng chính việc em <u>suy nghĩ, tự vẽ và tự giải thích</u> mới giúp kiến thức trở thành của em.</p>
    <p class="finale">🌱 HÔM NAY CHƯA CẦN HOÀN HẢO.<br>CHỈ CẦN EM HIỂU VÀ TẠO ĐƯỢC WEBQUEST ĐẦU TIÊN.</p>
    <p class="teacher">📒 Mỗi học sinh có một trang “WebQuest đầu tiên của em” trong tập.</p></section>`));
});

/* ---------- điều hướng ---------- */
function go(i){
  i=Math.max(0,Math.min(screens.length-1,i));
  S.idx=i;if(i>1)S.last=Math.max(S.last||0,i);
  save();render();window.scrollTo({top:0});
}
function render(){
  clearTimers();
  document.body.classList.remove('night');
  document.querySelectorAll('.confetti').forEach(x=>x.remove());
  const scr=screens[S.idx];
  const main=$('#stage');main.innerHTML='';
  // tiến trình
  const pg=$('#progress');
  if(scr.stage===0){pg.className='hidden'}
  else{
    pg.className='';
    // tính tiến độ trong giai đoạn
    const inStage=screens.filter(s=>s.stage===scr.stage);
    const w=Math.round(((inStage.indexOf(scr)+1)/inStage.length)*100);
    pg.innerHTML=STAGES.map((n,i)=>{
      const cls=(i+1<scr.stage)?'done':(i+1===scr.stage?'cur':'');
      return `<div class="pstep ${cls}" ${cls==='cur'?`style="--w:${w}%"`:''}><div class="bar"><i></i></div>${i+1}. ${n}</div>`;
    }).join('');
  }
  // banner đổi vai
  const b=$('#banner');b.innerHTML='';
  if(scr.role){
    const a=scr.role===1?S.n1:S.n2,o=scr.role===1?S.n2:S.n1;
    b.append(html(`<div class="role">🖱️ <b>${esc(a)}</b> thao tác &nbsp;·&nbsp; 👀 <b>${esc(o)}</b> quan sát và giải thích</div>`));
    if(prevRole&&prevRole!==scr.role)b.append(html('<div class="swap">🔄 Hãy đổi vai cho bạn bên cạnh!</div>'));
    prevRole=scr.role;
  }else if(scr.banner){
    b.append(html(`<div class="role solo">${scr.banner}</div>`));
  }
  $('#who').textContent=S.n1&&S.n2&&scr.stage>0?`${S.n1} & ${S.n2}${S.cls?' · Lớp '+S.cls:''}`:'';
  $('#jump').value=String(S.idx);
  scr.render(main);
}
const jump=$('#jump');
screens.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=s.t;jump.append(o)});
jump.addEventListener('change',()=>{
  if(jump.value>1&&!(S.n1&&S.n2)){S.n1=S.n1||'Bạn 1';S.n2=S.n2||'Bạn 2'}
  go(parseInt(jump.value,10));
});
$('#reset').addEventListener('click',()=>{
  if(confirm('Làm lại từ đầu? Dữ liệu đã lưu trên máy này sẽ bị xóa.')){
    S=fresh();try{localStorage.removeItem(KEY)}catch(e){}prevRole=0;go(0);
  }
});
render();
})();
</script>
